<style>

<rect x="20" y="800" width="2010" height="83" rx="7" fill="#f5f5f5" stroke="#8a94a3" stroke-width="1.2"/>
<text class="note" x="38" y="827">Aha moment: within 5 minutes the agent shows something the user didn&#x27;t know — a renewal coming up, a forgotten subscription, or last year&#x27;s refund.</text>
<text class="note" x="38" y="846">Permission tiers: Notify only → Prepare and ask (default) → Act within limits, e.g. &quot;cancel subscriptions under $20 without asking&quot;. Filing, paying, and signing always ask.</text>
<text class="note" x="38" y="865">No agent action of any kind runs until KYC has passed.</text>
